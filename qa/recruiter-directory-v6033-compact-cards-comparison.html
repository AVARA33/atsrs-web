<body>
  <main class="grid">
    <section class="panel"><strong>REFERENCE</strong><div class="frame"><img src="recruiter-directory-v6033-compact-cards-reference.png" alt="Original Recruiter Directory card layout"></div></section>
    <section class="panel"><strong>IMPLEMENTATION</strong><div class="frame"><img src="recruiter-directory-v6033-compact-cards-preview.png" alt="Compact three-column Recruiter Directory cards"></div></section>
  </main>
</body>
</html>
