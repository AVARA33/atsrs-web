<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companies Directory V6034</title>
<link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/jobs-prototype.css"><link rel="stylesheet" href="../css/employers.css"><link rel="stylesheet" href="../css/company-directory-v6034.css"><link rel="stylesheet" href="../vendor/phosphor-icons/phosphor-regular.css">
<style>body{margin:0;background:#020605}#app.app{display:grid!important;grid-template-columns:140px minmax(0,1fr)!important;min-height:100vh}.app>.sidebar{position:relative!important;width:140px!important;min-width:140px!important;display:flex;flex-direction:column;align-items:center;padding:18px 10px;border-right:1px solid #1b2520}.sidebar img{width:74px}.sidebar nav{display:grid;gap:22px;margin-top:28px;text-align:center}.sidebar a{color:#eef4f0;text-decoration:none;font:700 12px/1.2 Arial}.sidebar i{display:block;margin-bottom:7px;color:#aebbb3;font-size:23px}.sidebar a.active{color:#48df70}.main{padding:72px 34px 40px!important;min-width:0}.employers-page{display:grid!important}.employer-actions a:nth-child(1),.employer-actions a:nth-child(2){display:flex;align-items:center;justify-content:center;color:#eaf1ec;text-decoration:none;border:1px solid #28332d;border-radius:9px}.jobs-pagination{display:flex}.jobs-page-button{min-width:38px;height:38px;border:1px solid #2b3730;border-radius:9px;background:#0a0f0c;color:#eaf1ec}.jobs-page-button.active{border-color:#48df70;color:#48df70}</style></head><body>
<div id="app" class="app" style="grid-template-columns:140px minmax(0,1fr)!important"><aside class="sidebar" style="width:140px!important;min-width:140px!important"><img src="../assets/branding/atsrs-mark-green.png" alt="ATSRS"><nav><a href="#"><i class="ph ph-squares-four"></i>Dashboard</a><a href="#"><i class="ph ph-briefcase"></i>JobSearch</a><a href="#"><i class="ph ph-identification-card"></i>Recruiters</a><a class="active" href="#"><i class="ph ph-buildings"></i>Companies</a><a href="#"><i class="ph ph-file"></i>Documents</a><a href="#"><i class="ph ph-files"></i>References</a><a href="#"><i class="ph ph-user-circle"></i>Profile</a></nav></aside><main class="main">
<section id="employersPage" class="employers-page" aria-label="Companies">
  <header class="employers-hero company-directory-hero"><div class="company-hero-copy"><span class="company-hero-eyebrow">Verified employer directory</span><h1>Companies on ATSRS</h1><p>One trusted place to explore employers, official channels and current vacancies.</p><div class="company-trust-strip"><span><i class="ph ph-shield-check"></i><strong>96 verified · official sources</strong></span><span><i class="ph ph-identification-card"></i>Verified profiles</span><span><i class="ph ph-paper-plane-tilt"></i>Direct applications</span><span><i class="ph ph-chart-bar"></i>Live vacancy signals</span></div></div><div class="company-hero-network"><div class="company-network-backdrop"></div><div class="company-network-core"><i class="ph ph-shield"></i><i class="ph ph-buildings"></i></div><div class="company-network-logo company-network-aramco"><img src="../assets/company-logos/saudi-aramco.jpg" alt="Saudi Aramco"></div><div class="company-network-logo company-network-sabic"><img src="../assets/company-logos/sabic-reference.jpg" alt="SABIC"></div><div class="company-network-logo company-network-neom"><img src="../assets/company-logos/neom.png" alt="NEOM"></div><div class="company-network-logo company-network-maaden"><img src="../assets/company-logos/maaden.svg" alt="Ma'aden"></div><div class="company-network-logo company-network-stc"><img src="../assets/company-logos/stc.jpg" alt="stc"></div></div></header>
  <div class="employers-toolbar"><label class="atsrs-search-field"><span>Search</span><span class="atsrs-search-control"><i class="ph ph-magnifying-glass"></i><input placeholder="Company name or keyword"></span></label><label class="employers-sector"><span>Industry</span><select><option>All industries</option></select></label><label class="employers-sector"><span>Location</span><select><option>All locations</option></select></label><label class="employers-sector"><span>Company size</span><select><option>All sizes</option></select></label><label class="employers-sector"><span>Sort</span><select><option>Verified first</option></select></label><button id="employersClearFilters">Clear filters</button></div>
  <div class="employers-grid" id="employersGrid"></div><nav class="jobs-pagination employers-pagination"><button class="jobs-page-button active">1</button><button class="jobs-page-button">2</button><button class="jobs-page-button">3</button><button class="jobs-page-button">Next</button></nav>
</section></main></div>
<script>const data=[['Saudi Aramco','Energy · Oil & Gas','saudi-aramco.jpg'],['SABIC','Chemicals · Manufacturing','sabic-reference.jpg'],['stc','Technology · Telecommunications','stc.jpg'],['NEOM','Development · Infrastructure','neom.png'],["Ma'aden",'Mining · Materials','maaden.svg'],['Airswift','Workforce Solutions','']];const grid=document.querySelector('#employersGrid');data.forEach(([name,sector,logo],i)=>{const a=document.createElement('article');a.className='employer-card';a.innerHTML=`<div class="employer-card-head"><div class="employer-mark">${logo?`<img class="employer-logo" src="../assets/company-logos/${logo}" alt="">`:`<span class="employer-mark-fallback">${name.slice(0,2).toUpperCase()}</span>`}</div><div class="employer-card-copy"><span class="employer-source"><i class="ph ph-seal-check"></i> Verified company</span><h4>${name}</h4><strong class="employer-sector-label">${sector}</strong><p></p></div></div><div class="employer-vacancy-panel"><span><i class="ph ph-circle"></i>${i<3?'Hiring now':'Official careers source'}</span><strong>0</strong><span></span></div><div class="employer-tags"></div><div class="employer-actions"><a href="#"><i class="ph ph-arrow-square-out"></i><span>Website</span></a><a href="#"><i class="ph ph-briefcase"></i><span>Careers</span></a></div>`;grid.append(a)});</script></body></html>
