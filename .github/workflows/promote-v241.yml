name: Promote ATSRS V241 shell

on:
  push:
    paths:
      - .github/workflows/promote-v241.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the HTML shell cache keys
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'id="atsrs-v240-session-boot-style"': 'id="atsrs-v241-session-boot-style"',
              '<div>ATSRS V240</div>': '<div>ATSRS V241</div>',
              'js/boot-refresh.js?v=240': 'js/boot-refresh.js?v=241',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected marker not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit V241 shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Promote visible ATSRS build to V241"
          git push
