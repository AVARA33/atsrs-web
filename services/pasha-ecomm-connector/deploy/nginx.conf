limit_req_zone $binary_remote_addr zone=atsrs_pasha:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name payments-gateway.example.com;
    client_max_body_size 16k;

    ssl_certificate /etc/letsencrypt/live/payments-gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payments-gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /v1/payments/ {
        limit_req zone=atsrs_pasha burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
