<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050606">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ATSRS Phone Upload</title>
  <link rel="stylesheet" href="vendor/phosphor-icons/phosphor-regular.css?v=442">
  <link rel="stylesheet" href="css/qr-phone-upload-v535.css?v=535">
</head>
<body>
  <main class="phone-upload-shell">
    <section class="phone-upload-card" aria-labelledby="phoneUploadTitle">
      <div class="phone-upload-brand" aria-label="ATSRS">AT&amp;RS</div>
      <span class="phone-upload-kicker">SECURE PHONE UPLOAD</span>
      <h1 id="phoneUploadTitle">Add a document</h1>
      <p id="phoneUploadHelp">Choose a file from your phone or take a new photo. It will be sent only to the Personal account that created this QR code.</p>

      <div id="phoneUploadChoices" class="phone-upload-choices" hidden>
        <button id="takePhotoBtn" type="button"><i class="ph ph-camera" aria-hidden="true"></i><span>Take a photo</span></button>
        <button id="chooseFileBtn" class="secondary" type="button"><i class="ph ph-upload-simple" aria-hidden="true"></i><span>Choose a file</span></button>
      </div>
      <input id="cameraInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
      <input id="fileInput" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,.pdf,.jpg,.jpeg,.png,.webp" hidden>

      <div id="phoneUploadStatus" class="phone-upload-status" role="status" aria-live="polite">
        <i class="ph ph-spinner-gap" aria-hidden="true"></i><span>Checking secure upload...</span>
      </div>
      <div id="phoneUploadProgress" class="phone-upload-progress" hidden><span></span></div>
      <p class="phone-upload-note"><i class="ph ph-shield-check" aria-hidden="true"></i> One-time link · Maximum 15 MB · PDF, JPG, PNG or WebP</p>
    </section>
  </main>
  <script src="vendor/supabase-js-2.111.0.min.js" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <script src="js/qr-phone-upload-v535.js?v=535"></script>
</body>
</html>
