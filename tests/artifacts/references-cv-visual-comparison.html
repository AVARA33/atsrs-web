<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>References CV visual comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#111;color:#fff;font:14px Arial,sans-serif}
    h1{margin:0 0 18px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
    figure{margin:0;padding:12px;border:1px solid #3a3a3a;border-radius:12px;background:#191919}figcaption{margin:0 0 10px;font-weight:700}
    img{display:block;width:100%;height:auto;border:1px solid #303030}
  </style>
</head>
<body>
  <h1>References → CV / Resume — before and implementation</h1>
  <div class="grid">
    <figure><figcaption>Production before</figcaption><img src="references-cv-production-before.png" alt="Production References CV before change"></figure>
    <figure><figcaption>Implementation — dark mode</figcaption><img src="references-cv-separation-dark-desktop.png" alt="Implemented separated Main and AI CV cards"></figure>
  </div>
</body>
</html>
