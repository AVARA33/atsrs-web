<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS Executive Dashboard Harness</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/calm-actions.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/personal-workspace-surface.css">
  <link rel="stylesheet" href="../../css/personal-dashboard-qa.css">
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css">
  <link rel="stylesheet" href="../../css/theme-palette-v508.css">
  <link rel="stylesheet" href="../../css/workspace-surface-standard-v519.css">
  <link rel="stylesheet" href="../../css/workspace-control-standard-v522.css">
  <link rel="stylesheet" href="../../css/workspace-control-standard-v523.css">
  <link rel="stylesheet" href="../../css/button-content-standard-v58148.css">
  <link rel="stylesheet" href="../../css/dark-surface-standard-v58154.css">
  <link rel="stylesheet" href="../../css/floating-field-standard-v58178.css">
  <link rel="stylesheet" href="../../css/executive-dashboard-v5858.css">
  <style>body{margin:0}.app{display:block!important}.main{max-width:none!important;padding:32px!important}.hidden{display:none!important}</style>
</head>
<body class="personal-mode">
  <div id="app" class="app">
    <main class="main">
      <section id="dashboardPage">
        <h1 id="dashboardHeading">Dashboard</h1>
        <div class="solo-hero panel"><div class="hero-card"><p>Review document totals, expiry risk and profile readiness from one clear view.</p></div></div>
        <div class="grid stats-grid">
          <div class="card corporate-personnel-summary-card expiry-summary-card hidden"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-users-three"></i></span><p>Total Personnel</p></div><div class="stat" id="totalPersonnel">4</div></div>
          <div class="card expiry-summary-card expiry-summary-uploaded"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-file-text"></i></span><p>Uploaded Documents</p></div><div class="stat">6</div></div>
          <div class="card expiry-summary-card expiry-summary-90"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-calendar-dots"></i></span><p>Expiring in 90 Days</p></div><div class="stat">1</div></div>
          <div class="card expiry-summary-card expiry-summary-60"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-calendar-dots"></i></span><p>Expiring in 60 Days</p></div><div class="stat">0</div></div>
          <div class="card expiry-summary-card expiry-summary-30"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-calendar-dots"></i></span><p>Expiring in 30 Days</p></div><div class="stat">1</div></div>
          <div class="card expiry-summary-card expiry-summary-7"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-calendar-x"></i></span><p>Expiring in 1 Week</p></div><div class="stat">0</div></div>
          <div class="card expiry-summary-card expiry-summary-expired"><div class="expiry-summary-head"><span class="expiry-summary-icon"><i class="ph ph-x-circle"></i></span><p>Expired</p></div><div class="stat">1</div></div>
        </div>
      </section>
      <button id="navCertificates" class="hidden" hidden></button><button id="navProfile" class="hidden" hidden></button><button id="navJobs" class="hidden" hidden></button><button id="navPrivacy" class="hidden" hidden></button>
      <button id="navPersonnel" class="hidden" hidden></button><button id="navCompliance" class="hidden" hidden></button><button id="navReports" class="hidden" hidden></button><button id="navProjects" class="hidden" hidden></button>
    </main>
  </div>
  <script>
    const params=new URLSearchParams(location.search),isCompany=params.get('mode')==='company',storageDelay=Math.max(0,Number(params.get('storageDelay'))||0);
    document.documentElement.dataset.theme=params.get('theme')==='light'?'light':'dark';
    document.body.className=isCompany?'company-mode':'personal-mode';
    window.useMode=isCompany?'company':'personal';
    window.currentUser={id:'qa-personal-user'};
    localStorage.setItem('atsrs_use_mode',window.useMode);
    if(isCompany)document.querySelector('.corporate-personnel-summary-card').classList.remove('hidden');
    window.showPage=function(page){window.lastRoute=page;};
    window.getData=function(){return[
      {type:'Medical certificate',expiry:'2027-08-01',uploadedAt:'2026-08-21T08:00:00Z'},
      {type:'Safety training',expiry:'2026-09-24',uploadedAt:'2026-08-20T08:00:00Z'},
      {type:'Identity record',expiry:'N/A',uploadedAt:'2026-08-18T08:00:00Z'},
      {type:'Expired training',expiry:'2025-08-01',uploadedAt:'2026-08-10T08:00:00Z'},
      {type:'Offshore survival',expiry:'2026-08-29',uploadedAt:'2026-08-09T08:00:00Z'},
      {type:'Passport',expiry:'2026-09-10',uploadedAt:'2026-08-08T08:00:00Z'},
      {type:'Seafarer medical',expiry:'2026-10-21',uploadedAt:'2026-08-07T08:00:00Z'},
      {type:'Radio operator certificate',expiry:'2027-01-15',uploadedAt:'2026-08-06T08:00:00Z'},
      {type:'Driving licence',expiry:'2027-06-30',uploadedAt:'2026-08-05T08:00:00Z'},
      {type:'Company authorization',expiry:'N/A',uploadedAt:'2026-08-04T08:00:00Z'}
    ]};
    window.supabaseClient={
      auth:{getUser:async function(){return{data:{user:{id:'qa-personal-user'}}};}},
      from:function(){var query={select:function(){return query;},eq:function(){return query;},then:function(resolve){return new Promise(function(done){setTimeout(function(){done({data:[{size_bytes:3145728},{size_bytes:1572864}],error:null});},storageDelay);}).then(resolve);}};return query;},
      rpc:async function(){if(storageDelay)await new Promise(function(done){setTimeout(done,storageDelay);});return{data:[{plan_name:params.get('plan')==='titan'?'Titan':'Bronze',storage_bytes_limit:params.get('plan')==='titan'?21474836480:1073741824}],error:null};}
    };
    window.atsrsCorporateReporting={getCompliance:function(){return{
      summary:{current:2},rows:[{name:'Candidate',surname:'One',documents:[
        {title:'Medical certificate',status:'Current',uploaded_at:'2026-08-21T08:00:00Z'},
        {title:'Safety training',status:'Expires within 33 days',uploaded_at:'2026-08-20T08:00:00Z'}
      ]}]
    }}};
  </script>
  <script src="../../js/expiry-status.js"></script>
  <script src="../../js/executive-dashboard-v5858.js"></script>
</body>
</html>
