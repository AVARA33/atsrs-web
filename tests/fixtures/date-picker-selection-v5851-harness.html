<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS calendar selection harness</title>
  <script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light';</script>
  <link rel="stylesheet" href="../../css/date-picker.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/jobs-prototype.css">
  <link rel="stylesheet" href="../../css/floating-field-standard-v58178.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:40px;background:var(--atsrs-field-surface);color:var(--atsrs-field-text);font:16px/1.4 Arial,sans-serif}.qa-shell{display:grid;gap:24px;width:min(620px,100%);margin:auto}.qa-reference{display:flex;align-items:center;gap:12px}.qa-field{display:grid;gap:8px;width:280px}.qa-field input{min-height:44px;padding:0 12px;border:1px solid var(--atsrs-field-line);border-radius:10px;background:var(--atsrs-field-surface);color:var(--atsrs-field-text)}#app.app:not(.hidden) #jobsPage .jobs-pagination{margin:0}
  </style>
</head>
<body class="personal-mode">
  <main class="qa-shell">
    <div id="app" class="app">
      <section id="jobsPage">
        <div class="qa-reference"><strong>Active pagination reference</strong><nav class="jobs-pagination"><button class="jobs-page-button is-current" aria-current="page">1</button></nav></div>
      </section>
    </div>
    <label class="qa-field">Selected calendar date<input id="qaDate" type="date" value="2026-08-17"></label>
  </main>
  <script src="../../js/date-picker.js"></script>
</body>
</html>
