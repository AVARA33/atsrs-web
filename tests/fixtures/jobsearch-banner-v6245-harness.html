<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JobSearch copper banner V6245</title>
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css">
  <link rel="stylesheet" href="../../css/jobs-prototype.css">
  <link rel="stylesheet" href="../../css/jobsearch-hero-v6002.css">
  <link rel="stylesheet" href="../../css/app-copper-theme-v6243.css">
  <link rel="stylesheet" href="../../css/jobsearch-banner-copper-v6245.css">
  <link rel="stylesheet" href="../../css/banner-visuals-white-v6246.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:48px;background:#0B0C0D;color:#F7F4F1;font-family:Inter,Arial,sans-serif}
    #app{max-width:1500px;margin:0 auto}
  </style>
</head>
<body class="personal-mode">
  <main id="app" class="app">
    <section id="jobsPage" class="jobs-page" aria-label="JobSearch">
      <div class="jobs-hero">
        <div class="jobs-hero-copy">
          <div class="jobs-hero-icon" aria-hidden="true"><i class="ph ph-globe-hemisphere-west"></i></div>
          <div class="jobs-hero-content">
            <span class="jobs-hero-eyebrow">Offshore opportunities</span>
            <h3 id="jobsHeading">JobSearch</h3>
            <p>Discover your next opportunity offshore</p>
          </div>
        </div>
        <div class="jobs-hero-map" aria-hidden="true"></div>
        <nav class="jobs-region-nav" aria-label="Browse jobs by region">
          <button type="button" class="is-active">Worldwide</button>
          <button type="button">Europe &amp; Central Asia</button>
          <button type="button">Middle East</button>
          <button type="button">Africa</button>
          <button type="button">Asia-Pacific</button>
          <button type="button">North America</button>
          <button type="button">Remote / Worldwide</button>
        </nav>
        <div class="jobs-snapshot" aria-label="Jobs data snapshot">
          <i class="ph ph-briefcase-metal" aria-hidden="true"></i>
          <strong>30 of 12,250 opportunities</strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
