<!doctype html>
<html data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css">

  <style>

    html[data-theme=light]{--bg:#edf2f8;--surface:#fff;--surface-2:#f4f7fb;--line:#c8d4de;--text:#172b3d;--muted:#617386;--accent:#2563eb}
    body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,sans-serif}.personal-mode{padding:50px}.panel{max-width:1240px;margin:auto}h3{color:var(--text);font-size:32px;margin:0}.profile-rebuild-subtitle{color:var(--muted)}.hidden{display:none!important}

</head>

          <p><i class="ph ph-envelope"></i><span>anaragasiyev@gmail.com</span></p><p><i class="ph ph-phone"></i><span>+994 55 350 15 15</span></p><p><i class="ph ph-map-pin"></i><span>Baku, Azerbaijan</span></p><p><i class="ph ph-briefcase"></i><span>Freelancer</span></p>
        </div>
      </div>
      <div class="profile-summary-meta">
        <dl><div><dt>Member since</dt><dd>12 May 2024</dd></div><div><dt>Last login</dt><dd>23 Aug 2025 · 09:18</dd></div></dl>

      </div>
    </article></div>
  </div></section>
  <script>if(location.search.includes('light'))document.documentElement.dataset.theme='light'</script>
</body>
</html>
