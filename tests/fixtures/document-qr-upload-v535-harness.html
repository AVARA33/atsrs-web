<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css?v=442">
  <link rel="stylesheet" href="../../css/base.css?v=408">
  <link rel="stylesheet" href="../../css/account.css?v=422">
  <link rel="stylesheet" href="../../css/workspace-control-standard-v522.css?v=522-2">
  <link rel="stylesheet" href="../../css/document-qr-upload-v535.css?v=535">
  <style>
    body{margin:0;min-height:100vh;background:#050606}.demo{padding:24px}.cert-mode-buttons{display:flex;gap:10px;flex-wrap:wrap}.cert-mode-buttons button{min-height:44px}.light-switch{position:fixed;right:12px;top:12px;z-index:13000}
    html[data-theme="light"] body{background:#edf2f8}
  </style>
</head>
<body class="personal-mode">
  <button class="light-switch" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Theme</button>
  <div class="demo" id="certificatesPage">
    <div class="cert-mode-buttons">
      <button type="button">Scan with AI</button>
      <button type="button"><i class="ph ph-qr-code"></i><span>Scan with QR</span></button>
      <button type="button">Manual Upload</button>
    </div>
  </div>
  <div class="atsrs-qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qrUploadTitle">
    <div class="atsrs-qr-dialog-backdrop"></div>
    <div class="atsrs-qr-dialog-card">
      <div class="atsrs-qr-dialog-head"><div><span class="pill">PHONE UPLOAD</span><h3 id="qrUploadTitle">Scan with QR</h3></div><button class="secondary atsrs-qr-icon-button" aria-label="Close"><i class="ph ph-x"></i></button></div>
      <p class="sub">Scan this code with your phone. Then choose a file or take a photo.</p>
      <div class="atsrs-qr-code"><svg viewBox="0 0 21 21" role="img" aria-label="QR preview"><rect width="21" height="21" fill="#fff"/><path d="M1 1h6v6H1zm2 2v2h2V3zm11-2h6v6h-6zm2 2v2h2V3zM1 14h6v6H1zm2 2v2h2v-2zm7-8h2v2h-2zm3 2h2v2h-2zm-5 3h2v2H8zm3 3h2v2h-2zm4-2h2v2h-2zm2 4h2v2h-2z" fill="#050606"/></svg></div>
      <div class="atsrs-qr-session-meta"><span><i class="ph ph-shield-check"></i> Secure one-time upload</span><span>Valid for 09:42</span></div>
      <div class="atsrs-qr-status">Ready. Scan the code with your phone.</div>
      <div class="atsrs-qr-dialog-actions"><button class="secondary"><i class="ph ph-arrows-clockwise"></i><span>New QR code</span></button><button class="secondary">Cancel</button></div>
    </div>
  </div>
</body>
</html>
