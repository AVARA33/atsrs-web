<!doctype html>
<html data-theme="dark"><meta charset="utf-8"><title>Floating fields idle regression</title>
<style>body{background:rgb(5,6,6);color:white}.hidden{display:none}</style>
<body><label class="field-wrap">Name<input id="sample" value="Example"></label>
<section id="dynamic"></section><pre id="result">Running</pre>
<script>
let changes=0;
new MutationObserver(records=>{changes+=records.length}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});
</script>
<script src="../../js/floating-fields.js?v=58188"></script>
<script>
window.addEventListener('load',async()=>{
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 document.body.classList.add('ready');
 await wait(250);
 const before=changes;
 await wait(600);
 const idleChanges=changes-before;
 const sample=document.getElementById('sample');sample.disabled=true;
 await wait(150);
 const disabled=sample.closest('.atsrs-field-shell').classList.contains('atsrs-field-disabled');
 const label=document.createElement('label');label.className='field-wrap';label.textContent='Added';
 const input=document.createElement('input');label.append(input);document.getElementById('dynamic').append(label);
 await wait(150);
 const added=input.dataset.atsrsFloatingField==='1';
 document.body.style.backgroundColor='rgb(237, 242, 248)';document.documentElement.dataset.theme='light';
 await wait(150);
 const themed=sample.closest('.atsrs-field-shell').style.getPropertyValue('--atsrs-field-label-surface')==='rgb(237, 242, 248)';
 const end=changes;await wait(300);const settled=changes===end;
 document.getElementById('result').textContent=JSON.stringify({pass:idleChanges===0&&disabled&&added&&themed&&settled,idleChanges,disabled,added,themed,settled});
});
</script></body></html>
