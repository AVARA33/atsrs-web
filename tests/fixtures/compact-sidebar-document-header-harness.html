<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS compact navigation and document header QA</title>
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/corporate-information-architecture.css">
  <link rel="stylesheet" href="../../css/personal-workspace-surface.css">
  <link rel="stylesheet" href="../../css/sage-ledger.css?v=450">
</head>
<body class="personal-mode app-open">
  <section id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-head"><div class="brand">ATSRS</div></div>
      <div class="nav">
        <button id="navDashboard"><i class="ph ph-gauge sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Dashboard</span></button>
        <button id="navCertificates" class="active"><i class="ph ph-folder-open sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Documents</span></button>
        <button id="navRefs"><i class="ph ph-books sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">References &amp; CV</span></button>
        <button id="navProfile"><i class="ph ph-user-circle sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Profile</span></button>
        <button id="sageNavSecurity"><i class="ph ph-shield-check sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Security</span></button>
        <button id="sageNavSharing"><i class="ph ph-link sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Privacy &amp; Sharing</span></button>
        <div class="nav-utility-divider" aria-hidden="true"></div>
        <button id="navIntro" class="nav-utility"><i class="ph ph-sparkle sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Product Updates</span></button>
        <button id="navPrivacy" class="nav-utility"><i class="ph ph-shield-check sage-nav-icon" aria-hidden="true"></i><span class="sage-nav-label">Privacy</span></button>
      </div>
    </aside>

    <main class="main">
      <h2 id="pageTitle">Personal Account</h2>
      <section id="certificatesPage">
        <div class="panel">
          <h3>Add document</h3>
          <p class="sub">Choose one method: Scan with AI or Manual Upload.</p>
          <div class="cert-mode-buttons"><button class="secondary">Scan with AI</button><button class="secondary">Manual Upload</button></div>
        </div>
        <div class="panel">
          <h3>Document Register</h3>
          <div class="atsrs-document-register-toolbar">
            <label class="atsrs-document-filter"><span>Filter</span><input type="search" placeholder="Filter documents..."></label>
            <div class="atsrs-document-bulk-actions"><span id="certSelectionCount">0 selected</span><button class="secondary" disabled>Delete selected</button></div>
          </div>
          <div class="table-wrap">
            <table class="atsrs-document-register">
              <thead><tr>
                <th class="atsrs-document-select-column"><input type="checkbox" aria-label="Select all visible documents"></th>
                <th><button class="atsrs-document-sort"><span>Certificate</span><span class="atsrs-sort-arrows" aria-hidden="true"><i>▲</i><i>▼</i></span></button></th>
                <th>Training Center / Provider</th>
                <th><button class="atsrs-document-sort"><span>Expiry</span><span class="atsrs-sort-arrows" aria-hidden="true"><i>▲</i><i>▼</i></span></button></th>
                <th><button class="atsrs-document-sort"><span>Uploaded</span><span class="atsrs-sort-arrows" aria-hidden="true"><i>▲</i><i>▼</i></span></button></th>
                <th><button class="atsrs-document-sort"><span>Status</span><span class="atsrs-sort-arrows" aria-hidden="true"><i>▲</i><i>▼</i></span></button></th>
                <th>Action</th>
              </tr></thead>
              <tbody>
                <tr><td><input type="checkbox"></td><td>STCW</td><td>State Maritime and Port Agency</td><td>2029-05-27</td><td><span class="atsrs-upload-date">21 Jul 2026</span></td><td>Valid</td><td><button class="secondary">Preview</button></td></tr>
                <tr><td><input type="checkbox"></td><td>ISPS</td><td>State Maritime and Port Agency</td><td>N/A</td><td><span class="atsrs-upload-date">21 Jul 2026</span></td><td>No Expiry</td><td><button class="secondary">Preview</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </section>
  <script src="../../js/sage-ledger.js?v=450"></script>
  <script>
    setTimeout(function(){
      document.getElementById('navIntro').textContent='ATSRS Updates';
    },1200);
  </script>
</body>
</html>
