<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS Documents dark field parity</title>
  <link rel="stylesheet" href="../../css/floating-field-standard-v58178.css?v=58205-qa">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050606;color:#f4f6ef;font:14px Arial,sans-serif}.app{min-height:100vh;padding:28px}.documents-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1100px;margin:auto}.documents-surface{padding:24px;border:1px solid #202725;border-radius:16px;background:#0b0d0d}.documents-surface h1{margin:0 0 24px;font-size:22px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.atsrs-document-filter{display:block;margin-top:20px}@media(max-width:760px){.app{padding:16px}.documents-grid,.field-grid{grid-template-columns:1fr}.documents-surface{padding:18px}}
  </style>
</head>
<body>
<section id="app" class="app">
  <main id="certificatesPage">
    <div class="documents-grid">
      <section class="documents-surface" data-account-mode="personal">
        <h1>Personal Documents</h1>
        <div class="field-grid">
          <div class="field-wrap"><label class="field-label" for="personalType">Document type</label><input id="personalType" value="BOSIET"></div>
          <div class="field-wrap"><label class="field-label" for="personalProvider">Provider</label><input id="personalProvider" value="Training Centre"></div>
          <div class="field-wrap"><label class="field-label" for="personalIssue">Issue date</label><input id="personalIssue" type="date" value="2026-08-21"></div>
          <div class="field-wrap"><label class="field-label" for="personalExpiry">Expiry date</label><input id="personalExpiry" type="date" value="2027-08-21"></div>
        </div>
        <label class="atsrs-document-filter" for="personalFilter"><span>Filter</span><input id="personalFilter" type="search" value="Certificate"></label>
      </section>
      <section class="documents-surface" data-account-mode="corporate">
        <h1>Corporate Documents</h1>
        <div class="field-grid">
          <div class="field-wrap"><label class="field-label" for="corporatePerson">Personnel</label><select id="corporatePerson"><option>Candidate Example</option></select></div>
          <div class="field-wrap"><label class="field-label" for="corporateType">Document type</label><input id="corporateType" value="Medical"></div>
          <div class="field-wrap"><label class="field-label" for="corporateIssue">Issue date</label><input id="corporateIssue" type="date" value="2026-08-21"></div>
          <div class="field-wrap"><label class="field-label" for="corporateExpiry">Expiry date</label><input id="corporateExpiry" type="date" value="2027-08-21"></div>
        </div>
        <label class="atsrs-document-filter" for="corporateFilter"><span>Filter</span><input id="corporateFilter" type="search" value="Personnel"></label>
      </section>
    </div>
  </main>
</section>
<script src="../../js/floating-fields.js?v=58185-qa"></script>
</body>
</html>
