<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS Loading Brand Harness</title>
  <link id="atsrsBootLogoPreload" rel="preload" as="image" fetchpriority="high">
  <script>
    var bootTheme=new URLSearchParams(location.search).get('theme')==='light'?'light':'dark';
    document.documentElement.dataset.theme=bootTheme;
    document.getElementById('atsrsBootLogoPreload').href=bootTheme==='light'?
      '../../assets/branding/atsrs-lockup-light-transparent.png':
      '../../assets/branding/atsrs-mark-green.png';
  </script>
  <link rel="stylesheet" href="../../css/base.css?v=408">
  <link rel="stylesheet" href="../../css/theme.css?v=504">
  <link rel="stylesheet" href="../../css/brand-auth-v513.css?v=547">
</head>
<body class="atsrs-booting">
  <div id="atsrsBootScreen" role="status" aria-label="Loading ATSRS">
    <div class="atsrs-boot-mark" aria-hidden="true"><span class="atsrs-boot-shine"></span></div>
  </div>
</body>
</html>
