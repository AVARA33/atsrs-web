<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <title>ATSRS Jobs Prototype QA</title>

  <style>
    :root{--text:#f8fafc;--muted:#9aa8bc;--sidebar-accent:#b6ff00;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font:15px/1.45 Arial,sans-serif}main{padding:38px clamp(18px,4vw,56px)}
    .pill{display:inline-flex;padding:7px 11px;border:1px solid;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.05em}
    button{border:1px solid #334155;border-radius:12px;background:#090c0b;color:#f8fafc;font:inherit;font-weight:800;padding:0 15px}
    .hidden{display:none!important}.fixture-jobs-nav{position:fixed;z-index:999;left:0;top:0;width:1px;height:1px;padding:0;opacity:.01;overflow:hidden}
    html[data-theme="dark"]{--sidebar-accent:#22c55e}html[data-theme="light"]{--text:#13233c;--muted:#5f7088;color-scheme:light}html[data-theme="light"] body{background:#edf2f8;color:#13233c}html[data-theme="light"] button{background:#fff;color:#13233c;border-color:#cbd5e1}
  </style>
</head>
<body class="personal-mode">
<button id="navJobs" type="button" class="fixture-jobs-nav" onclick="window.dispatchEvent(new CustomEvent('atsrs:jobs-nav'))">Jobs</button>
<script>var fixtureParams=new URLSearchParams(location.search);document.documentElement.dataset.theme=fixtureParams.get('theme')==='light'?'light':'dark';try{localStorage.setItem('atsrs_jobs_view',fixtureParams.get('view')==='list'?'list':'cards')}catch(ignore){}</script>
<section id="app" class="app"><main class="main">
<section id="jobsPage" class="jobs-page" aria-label="Jobs">
  <div class="jobs-hero"><div><span class="pill jobs-development-badge">LIVE JOBS</span><h3>Latest opportunities</h3><p>Recent recruiter-sourced opportunities, organised for a faster and clearer review.</p></div><div class="jobs-hero-actions"><div class="jobs-snapshot"><strong id="jobsVisibleCount" aria-live="polite">0 of 0 opportunities</strong><span>Server-backed vacancies</span></div><div class="talent-view-switch jobs-view-switch" role="group" aria-label="Jobs view"><button type="button" data-jobs-view="cards">Cards</button><button type="button" data-jobs-view="list">List</button></div></div></div>
  <div class="jobs-notice" role="note"><i class="ph ph-warning" aria-hidden="true">⚠</i><p>No candidate commission.</p></div>
  <div class="jobs-filters"><label class="jobs-search"><span>Search</span><span class="jobs-search-control"><i aria-hidden="true">⌕</i><input id="jobsSearch" type="search" placeholder="Job title or role"></span></label><label><span>Role</span><select id="jobsRoleFilter"><option value="">All roles</option></select></label><label><span>Location</span><select id="jobsLocationFilter"><option value="">All locations</option></select></label><button id="jobsClearFilters" type="button">Clear filters</button></div>
  <button id="jobsMoreFilters" class="jobs-more-filters" type="button" aria-expanded="false" aria-controls="jobsSecondaryFilters"><span>More filters</span><i class="ph ph-sliders-horizontal" aria-hidden="true"></i></button>
  <section id="jobsSecondaryFilters" class="jobs-secondary-filters" aria-label="Additional job filters"><label class="jobs-secondary-field"><span>Company</span><input id="jobsCompanyFilter" type="search" list="jobsCompanyOptions" placeholder="All companies" autocomplete="off" aria-label="Filter jobs by company"><datalist id="jobsCompanyOptions"></datalist></label><label class="jobs-secondary-field"><span>Recruiter</span><input id="jobsRecruiterFilter" type="search" list="jobsRecruiterOptions" placeholder="All recruiters" autocomplete="off" aria-label="Filter jobs by recruiter"><datalist id="jobsRecruiterOptions"></datalist></label><label class="jobs-secondary-field jobs-date-filter"><span>Date posted</span><select id="jobsDateFilter" aria-label="Filter jobs by date posted"><option value="">Any time</option><option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label><fieldset class="jobs-worksite-filter"><legend>Worksite</legend><button id="jobsOffshoreFilter" class="jobs-filter-chip" type="button" aria-pressed="false">Offshore</button><button id="jobsOnshoreFilter" class="jobs-filter-chip" type="button" aria-pressed="false">Onshore</button></fieldset><label class="jobs-new-filter" for="jobsNewOnlyFilter"><span>New jobs only</span><input id="jobsNewOnlyFilter" type="checkbox" role="switch"><span class="jobs-toggle-track" aria-hidden="true"><span></span></span></label></section>
  <div id="jobsActiveFilters" class="jobs-active-filters hidden" aria-label="Active job filters"></div>
  <nav id="jobsPaginationTop" class="jobs-pagination jobs-pagination-top hidden" aria-label="Jobs pagination" data-jobs-pagination></nav><div id="jobsGrid" class="jobs-grid" aria-live="polite"></div><div id="jobsEmpty" class="jobs-empty hidden"><h2>No matching opportunities</h2><p>Clear filters.</p></div><nav id="jobsPaginationBottom" class="jobs-pagination jobs-pagination-bottom hidden" aria-label="Jobs pagination" data-jobs-pagination></nav>
</section>
</main></section>
<script>
  (function(){
    var adminMode=new URLSearchParams(location.search).get('admin')==='1';
    var seed=[
      {id:'1',title:'<img src=x onerror="window.__xss=1"> ROV Supervisor',company:'Film-Ocean',recruiter_company:'Film-Ocean',location:'Aberdeen, UK',worksite:'Offshore',equipment:'ROV',summary:'Safe server text with a longer description used to prove equal card sizing without hiding content.',requirements:'Valid offshore certification and verified equipment experience.',recruiter_name:'Verified Recruiter',recruiter_email:'jobs@example.com',recruiter_phone:'+44 1224 000000',source_type:'linkedin',source_url:'https://linkedin.com/example',application_url:'https://example.com/apply',status:'published',source_posted_at:new Date().toISOString().slice(0,10),closing_date:'2026-09-11',published_at:new Date(Date.now()-60000).toISOString(),updated_at:new Date().toISOString()},
      {id:'2',title:'Workshop Technician',company:'ROVOP',recruiter_company:'ROVOP',location:'Westhill, UK',worksite:'Workshop',summary:'Short verified summary.',recruiter_name:'Workshop Recruiter',source_type:'linkedin',source_url:'https://linkedin.com/example-two',application_url:'https://example.com/apply-two',status:'published',display_posted_date:new Date().toISOString().slice(0,10),published_at:new Date(Date.now()-120000).toISOString(),updated_at:new Date(Date.now()-1000).toISOString()},
      {id:'3',title:'Analysis Engineer with Subsea Integrity and Extremely Long Multidisciplinary Scope',company:'DOF International Operations and Engineering Services',recruiter_company:'DOF International Operations and Engineering Services',location:'Paradise, Canada',worksite:'On-site',work_type:'Temporary; on-site',duration:'6–12 months',summary:Array(18).fill('Engineering analysis role covering verified offshore systems, structural integrity, operational interfaces and documented technical assurance.').join(' '),requirements:Array(28).fill('OrcaFlex proficiency, offshore engineering experience, documented competency and clear technical reporting are required.').join(' '),recruiter_name:'Verified Recruiter with a deliberately long professional display name',recruiter_email:'verified.recruitment.operations@example.com',source_type:'linkedin',source_url:'https://linkedin.com/example-three-with-a-deliberately-long-path-for-overflow-testing',application_url:'https://example.com/apply/analysis-engineer-with-a-deliberately-long-path-for-overflow-testing',status:'published',published_at:new Date(Date.now()-180000).toISOString(),updated_at:new Date(Date.now()-2000).toISOString()}
    ],fixture=seed.concat(Array.from({length:62},function(_,i){var n=i+4,title=n===65?'Final Page Specialist':n===4?'ROV Pilot':n===5?'ROV Pilot Technician':n===6?'ROV Supervisor / Pilot Technician':n===7?'Reward Specialist':n===8?'Electrical Principal Engineer':n===9?'Logistics Category Buyer':n===10?'Driver - Shop Technician':'Project Engineer '+n,location=n===65?'Remote Arctic':n===4||n===6||n===7||n===8?'Offshore Ireland':n===5||n===9?'Qatar':n%3?'Aberdeen, UK':'Houston, US',summary=n>=7&&n<=9?'This non-ROV title mentions ROV only in vacancy details.':'Verified fixture vacancy '+n+'.',company=n%2?'Oceaneering':'TechnipFMC',worksite=n%4===0?'Offshore vessel':n%4===1?'On-site':n%4===2?'Hybrid':'Workshop',recruiter=n%5===0?'Alex Morgan':n%5===1?'Taylor Reed':'';return{id:String(n),title:title,company:company,recruiter_company:company,location:location,worksite:worksite,recruiter_name:recruiter,summary:summary,source_type:'linkedin',source_url:'https://linkedin.com/jobs/'+n,application_url:'https://example.com/apply/'+n,status:'published',source_posted_at:n<=20?new Date(Date.now()-n*86400000).toISOString().slice(0,10):null,published_at:new Date(Date.now()-(n<=8?n*60000:n*86400000)).toISOString(),updated_at:new Date(Date.now()-n*1000).toISOString()}}));
    function query(){var selected='*',exact=false,from=0,to=null,limit=null,equals={},titleTerms=[],minimums={},inValues={},dateOr='';var q={select:function(columns,opts){selected=columns||'*';exact=!!(opts&&opts.count==='exact');return q},eq:function(field,value){equals[field]=value;return q},ilike:function(field,pattern){if(field==='title')titleTerms.push(String(pattern).replace(/^%|%$/g,'').toLowerCase());return q},gte:function(field,value){minimums[field]=value;return q},in:function(field,values){inValues[field]=values;return q},or:function(value){dateOr=String(value);return q},lte:function(){return q},order:function(){return q},limit:function(value){limit=value;return q},range:function(start,end){from=start;to=end;return q},then:function(resolve){var rows=fixture.filter(function(job){return Object.keys(equals).every(function(field){return job[field]===equals[field]})&&Object.keys(minimums).every(function(field){return new Date(job[field]).getTime()>=new Date(minimums[field]).getTime()})&&Object.keys(inValues).every(function(field){return inValues[field].includes(job[field])})});if(titleTerms.length)rows=rows.filter(function(job){var title=String(job.title||'').toLowerCase();return titleTerms.every(function(term){return title.includes(term)})});if(dateOr){var match=dateOr.match(/source_posted_at\.gte\.([^,]+)/),cutoff=match&&match[1];rows=rows.filter(function(job){var source=job.source_posted_at||job.display_posted_date||job.published_at;return source&&new Date(source).getTime()>=new Date(cutoff).getTime()})}var count=rows.length;if(to!==null)rows=rows.slice(from,to+1);else if(limit!==null)rows=rows.slice(0,limit);if(selected!=='*'){var fields=selected.split(',');rows=rows.map(function(job){var picked={};fields.forEach(function(field){picked[field]=job[field]});return picked})}resolve({data:rows,error:null,count:exact?count:null})}};return q}
    window.supabaseClient={from:query,auth:{getSession:async function(){return{data:{session:adminMode?{user:{id:'owner'}}:null}}}},rpc:async function(){return{data:adminMode,error:null}}};
  })();
</script>
<script src="../../js/jobs-prototype.js?v=58138-qa"></script>
</body>
</html>
