  <link rel="stylesheet" href="../../css/base.css?v=408">
  <link rel="stylesheet" href="../../css/account.css?v=422">
  <link rel="stylesheet" href="../../css/theme.css?v=504">
  <link rel="stylesheet" href="../../css/workspace-surface-standard-v519.css?v=519">

  <link rel="stylesheet" href="../../css/workspace-control-standard-v522.css?v=522-2">

  <style>
    body{margin:0;padding:32px;background:#050606;color:#e5edf5}
    html[data-theme="light"] body{background:#edf2f8;color:#172b3d}
    #app{max-width:1180px;margin:auto}
    #refsPage .cv-card{max-width:980px}

<body class="personal-mode">
  <main id="app" class="app">
    <section id="refsPage">
      <div class="ref-card cv-card">
        <div class="cv-main-panel"><h3>CV / Resume</h3><p class="sub">Synthetic QA panel.</p></div>
        <div class="cv-beta-box">
          <span class="pill">AI CV GENERATOR</span>
          <h4>Generate ATSRS Profile CV</h4>
          <p class="sub">Turn saved profile details into a structured CV.</p>
          <div class="cv-generator-action-grid">
            <button id="generateCVBtn" class="secondary" type="button">Generate ATSRS CV</button>
            <button id="uploadCvFromGeneratorBtn" class="secondary" type="button">Enhance Existing CV</button>
            <div id="generatedCvActions" class="generated-cv-actions">
              <button id="previewGeneratedCvBtn" class="secondary" type="button">View Generated CV</button>
              <button id="printGeneratedCvBtn" class="secondary" type="button">Print / Save PDF</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
