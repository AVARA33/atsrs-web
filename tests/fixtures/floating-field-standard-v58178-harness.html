<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS floating field harness</title>
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css?v=442">
  <link rel="stylesheet" href="../../css/floating-field-standard-v58178.css?v=58188">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050606;color:#f4f6ef;font:14px Arial,sans-serif}.app{min-height:100vh;padding:32px}.panel{max-width:980px;margin:auto;padding:24px;border-radius:16px;background:#101414}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}.actions{display:flex;gap:12px;margin-top:24px}.hidden{display:none}.light{background:#edf2f8;color:#142c3f}button{min-height:40px;padding:0 16px}@media(max-width:768px){.app{padding:18px}.grid{grid-template-columns:1fr}.panel{padding:18px}}
  </style>
</head>
<body>
<section id="app" class="app">
  <main class="panel">
    <h1>Personal + Corporate field harness</h1>
    <div class="grid">
      <label class="field-wrap">Full name<input id="fullName" value="Candidate Example"></label>
      <div class="jobs-filter-field"><span id="roleLabel">Role</span><span class="jobs-select-host"><select id="role" aria-labelledby="roleLabel"><option>Engineer</option></select></span></div>
      <label class="profile-labeled-field">Availability<select id="availability"><option>Available now</option></select></label>
      <label class="field-wrap">Professional summary<textarea id="summary">Existing multiline value remains visible.</textarea></label>
      <div><label for="company">Company</label><input id="company" value="ATSRS"></div>
      <input id="search" aria-label="Search candidates" placeholder="Search...">
      <div class="phone-entry"><span class="phone-entry-label">Mobile phone</span><div class="phone-field"><button class="phone-code-picker" type="button">+994</button><input id="phone" value="501234567"></div></div>
      <label class="field-wrap">Disabled field<input id="disabled" value="Read only" disabled></label>
      <label class="field-wrap">Invalid field<input id="invalid" value="Needs review" aria-invalid="true"></label>
      <div class="talent-filter-field" role="group" aria-labelledby="talentWorkTypeLabel"><span id="talentWorkTypeLabel">Work type</span><details class="work-type-multiselect talent-work-type-filter"><summary>All work types</summary><div class="work-type-options"><label><input type="checkbox">Freelance</label></div></details></div>
    </div>
    <div class="actions"><button id="theme" type="button">Toggle theme</button><label><input id="check" type="checkbox"> Checkbox stays unchanged</label></div>
    <div class="hidden"><input id="hiddenPanelField" aria-label="Hidden field"></div>
  </main>
</section>
<script src="../../js/floating-fields.js?v=58187"></script>
<script>document.getElementById('theme').onclick=()=>{const html=document.documentElement;html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';document.body.classList.toggle('light',html.dataset.theme==='light')}</script>
</body>
</html>
