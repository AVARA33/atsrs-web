<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../vendor/phosphor-icons/phosphor-regular.css?v=442">
  <link rel="stylesheet" href="../../css/shell-polish.css?v=6096">
  <link rel="stylesheet" href="../../css/brand-copper-lockup-v6254.css?v=6257">
  <link rel="stylesheet" href="../../css/app-copper-theme-v6243.css?v=6264">
  <style>
    html,body{margin:0;min-height:100%;background:#0b0c0d}
    #app.app{display:grid;grid-template-columns:116px 1fr;min-height:100vh}
    .sidebar{box-sizing:border-box;width:116px;padding:0 8px;background:#080a0b;border-right:1px solid #25282b}
    .sidebar-head{display:flex;align-items:center;justify-content:center;width:100%;min-height:84px}
    .nav{display:flex;min-height:calc(100vh - 84px);flex-direction:column;justify-content:space-between}
    .nav-primary,.nav-utility-group{display:grid;gap:4px}
    .nav button{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;min-height:54px;padding:7px 4px;border:0;border-radius:8px;background:transparent;color:#d7d3cf;font:700 11px/1.1 Arial,sans-serif;cursor:pointer}
    .nav button i{font-size:22px}
    .sidebar-quick-links{display:flex;justify-content:space-around;padding:10px 0 14px}
    .sidebar-quick-links span{display:grid;width:26px;height:26px;place-items:center;color:#d7d3cf;cursor:pointer}
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-head"><div class="brand atsrs-sidebar-mark" role="img" aria-label="ATSRS"></div></div>
      <div class="nav">
        <div class="nav-primary">
          <button type="button"><i class="ph ph-squares-four atsrs-nav-icon"></i><span class="atsrs-nav-label">Dashboard</span></button>
          <button type="button"><i class="ph ph-briefcase atsrs-nav-icon"></i><span class="atsrs-nav-label">JobSearch</span></button>
          <button type="button" class="active"><i class="ph ph-address-book atsrs-nav-icon"></i><span class="atsrs-nav-label">Recruiters</span></button>
          <button type="button"><i class="ph ph-buildings atsrs-nav-icon"></i><span class="atsrs-nav-label">Companies</span></button>
          <button type="button"><i class="ph ph-file atsrs-nav-icon"></i><span class="atsrs-nav-label">Documents</span></button>
        </div>
        <div class="nav-utility-group">
          <button type="button"><i class="ph ph-user-circle atsrs-nav-icon"></i><span class="atsrs-nav-label">Profile</span></button>
          <nav class="sidebar-quick-links" aria-label="Quick Links">
            <span role="button" tabindex="0" aria-label="Support"><i class="ph ph-headset"></i></span>
            <span role="button" tabindex="0" aria-label="FAQ"><i class="ph ph-question"></i></span>
            <span role="button" tabindex="0" aria-label="Plans"><i class="ph ph-credit-card"></i></span>
          </nav>
        </div>
      </div>
    </aside>
    <main></main>
  </div>
</body>
</html>
