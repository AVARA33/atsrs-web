<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATSRS Profile work availability alignment</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/corporate-remediation.css">
  <link rel="stylesheet" href="../../css/personal-workspace-surface.css?v=436">
  <link rel="stylesheet" href="../../css/theme-palette-v508.css?v=58170">
  <link rel="stylesheet" href="../../css/floating-field-standard-v58178.css?v=58204-qa">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#050606;color:#f4f6ef;font:14px Arial,sans-serif}.app{min-height:100vh;padding:32px}.work-availability-card{max-width:1180px;margin:auto;padding:28px;border:1px solid #202725;border-radius:16px;background:#0b0d0d}.work-availability-heading{width:100%}
  </style>
</head>
<body class="personal-mode">
<section id="app" class="app">
  <main class="main">
    <section id="profilePage">
      <div class="work-availability-card">
        <div class="work-availability-heading"><div><span class="pill">WORK AVAILABILITY</span><h4>Let verified companies know when you can start</h4><p>Optional. This status appears on your profile and can be changed at any time.</p></div><span>Confirmed 15.08.2026</span></div>
        <div class="work-availability-grid">
          <label><span>Status</span><select id="profileAvailabilityStatus"><option selected>Available from a date</option></select></label>
          <label id="profileAvailableFromWrap" class="field-wrap"><span>Available from</span><input id="profileAvailableFrom" type="date" value="2026-09-01"></label>
          <div class="work-type-field"><span>Preferred work type</span><div id="profileWorkPreferences" class="work-type-select"><button id="profileWorkPreferencesToggle" class="work-type-select-toggle" type="button"><span>Any opportunity</span><span class="work-type-select-arrow">⌄</span></button></div></div>
        </div>
      </div>
    </section>
  </main>
</section>
<script src="../../js/floating-fields.js?v=58185-qa"></script>
</body>
</html>
