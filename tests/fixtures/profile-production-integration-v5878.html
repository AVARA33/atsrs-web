<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal Profile production integration QA</title>
  <style>html{visibility:hidden}</style>
</head>
<body class="personal-mode atsrs-app-visible app-open" data-atsrs-account-route="profile">
  <section id="app" class="app">
    <aside class="sidebar" aria-hidden="true"></aside>
    <main class="main"><h2 id="pageTitle">Profile</h2></main>
  </section>
  <script>
    (async function(){
      var source=await fetch('/index.html',{cache:'no-store'}).then(function(response){return response.text();});
      var parsed=new DOMParser().parseFromString(source,'text/html');
      var links=Array.from(parsed.querySelectorAll('link[rel="stylesheet"]'));
      await Promise.all(links.map(function(item){return new Promise(function(resolve){
        var link=document.createElement('link');link.rel='stylesheet';link.href=new URL(item.getAttribute('href'),location.origin+'/').href;link.onload=resolve;link.onerror=resolve;document.head.appendChild(link);
      });}));
      var profile=parsed.querySelector('#profilePage');
      profile.classList.remove('hidden');
      document.querySelector('.main').appendChild(document.importNode(profile,true));
      async function loadScript(src){return new Promise(function(resolve,reject){
        var script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.body.appendChild(script);
      });}
      await loadScript('/js/select-standard.js');
      await loadScript('/js/floating-fields.js');
      await loadScript('/js/profile-workspace-v5886.js');
      window.currentUser={id:'local_test_user',email:'qa@atsrs.test'};
      window.atsrsStableInterval=function(){};
      window.supabaseClient={
        auth:{getSession:async function(){return{data:{session:{access_token:'fixture-token'}}};}},
        functions:{invoke:async function(_name,options){return{data:options.body&&options.body.action==='status'?{verified:false}:{verified:false},error:null};}},
        from:function(){return{select:function(){return{eq:function(){return{maybeSingle:async function(){return{data:null,error:null};}};}};}};}
      };
      await loadScript('/js/dashboard.js');
      window.saveProfile=async function(){return true;};
      window.loadProfile();
      document.querySelector('#accountTitle').textContent='Profile';
      document.documentElement.dataset.theme=location.search.indexOf('light')>=0?'light':'dark';
      document.documentElement.style.visibility='visible';
    })().catch(function(error){document.documentElement.style.visibility='visible';document.body.textContent=error.message;console.error(error);});
  </script>
</body>
</html>
