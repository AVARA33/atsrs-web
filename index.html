<!-- ATSRS TEST V88 PATCH - APPEND BEFORE </body>

<style id="atsrs-v88-critical-ux-cleanup">
/* ================================
   ATSRS V88 — Professional UX Cleanup
   Build: 06 Jun 2026 04:18 UTC
   Based on current live V86/V87 layout
   ================================ */

:root{
  --atsrs-bg:#020617;
  --atsrs-surface:#0f172a;
  --atsrs-surface-2:#111827;
  --atsrs-card:#1e293b;
  --atsrs-border:rgba(148,163,184,.22);
  --atsrs-border-strong:rgba(148,163,184,.34);
  --atsrs-text:#e5e7eb;
  --atsrs-muted:#94a3b8;
  --atsrs-blue:#2563eb;
  --atsrs-blue-soft:rgba(37,99,235,.16);
  --atsrs-green:#22c55e;
  --atsrs-red:#ef4444;
  --atsrs-yellow:#facc15;
}

html,body{background:var(--atsrs-bg)!important;color:var(--atsrs-text)!important;}
body{font-family:Inter,Arial,sans-serif!important;}

/* 1) Top-right Language + Logout must belong to the page, not viewport */
#app{position:relative!important;}
.top-actions{
  position:absolute!important;
  top:18px!important;
  right:18px!important;
  left:auto!important;
  z-index:20!important;
  display:flex!important;
  align-items:center!important;
  gap:10px!important;
  transform:none!important;
}
.top-actions .lang-floating,
.app-lang-switcher{
  position:relative!important;
  top:auto!important;
  right:auto!important;
  left:auto!important;
  transform:none!important;
}
html[dir="rtl"] .top-actions{right:auto!important;left:18px!important;}

/* Login language also belongs to auth card/page, not screen */
.auth-card{position:relative!important;}
.auth-card>.lang-floating{
  position:absolute!important;
  top:18px!important;
  right:18px!important;
  left:auto!important;
  z-index:5!important;
}
html[dir="rtl"] .auth-card>.lang-floating{right:auto!important;left:18px!important;}

/* 2) Neutral language menu: no colorful item boxes */
.lang-circle{
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  padding:0!important;
  border-radius:999px!important;
  background:rgba(15,23,42,.92)!important;
  border:1px solid var(--atsrs-border-strong)!important;
  box-shadow:0 12px 30px rgba(0,0,0,.25)!important;
}
.lang-menu{
  width:178px!important;
  right:0!important;
  top:50px!important;
  padding:6px!important;
  border-radius:14px!important;
  background:rgba(15,23,42,.98)!important;
  border:1px solid var(--atsrs-border)!important;
  box-shadow:0 18px 44px rgba(0,0,0,.34)!important;
}
.lang-menu button{
  display:flex!important;
  align-items:center!important;
  gap:8px!important;
  width:100%!important;
  margin:0!important;
  padding:9px 10px!important;
  border-radius:10px!important;
  background:transparent!important;
  color:var(--atsrs-text)!important;
  border:0!important;
  text-align:left!important;
  font-weight:700!important;
  font-size:13px!important;
  box-shadow:none!important;
}
.lang-menu button:hover{background:rgba(148,163,184,.10)!important;}
.lang-menu span{width:22px!important;min-width:22px!important;}

/* 3) Login/landing: reduce noisy beta/marketing look */
.auth{
  min-height:100vh!important;
  align-items:center!important;
  justify-content:center!important;
  gap:22px!important;
  padding:24px!important;
  background:
    radial-gradient(circle at top left,rgba(37,99,235,.22),transparent 34%),
    linear-gradient(135deg,#020617,#08111f 55%,#020617)!important;
}
.auth-intro{
  max-width:620px!important;
  border-radius:24px!important;
  background:linear-gradient(135deg,rgba(15,23,42,.78),rgba(17,24,39,.94))!important;
  border:1px solid var(--atsrs-border)!important;
  box-shadow:0 24px 70px rgba(0,0,0,.30)!important;
}
.auth-card{
  max-width:420px!important;
  border-radius:24px!important;
  background:rgba(15,23,42,.94)!important;
  border:1px solid var(--atsrs-border)!important;
  box-shadow:0 24px 70px rgba(0,0,0,.32)!important;
}
.logo{letter-spacing:-.04em!important;}
#authSubtitle::after{
  content:'Track certificates, medicals, visas, references and compliance documents in one secure workspace.';
  display:block;
  margin-top:8px;
  color:#cbd5e1;
  line-height:1.45;
  font-size:14px;
}

/* Keep only a clean value proposition on landing */
.feature-grid,.intro-service-grid,.how-grid,.supported-industries,
.industry-tags,.auth-metric-grid,.mini-roadmap,.roadmap-grid{
  filter:saturate(.75)!important;
}
.feature-tile,.intro-service-card,.how-card,.card,.panel,.mini-panel{
  border-color:var(--atsrs-border)!important;
  background:rgba(15,23,42,.78)!important;
  box-shadow:none!important;
}
.feature-tile:hover,.intro-service-card:hover{border-color:var(--atsrs-border-strong)!important;}
.tile-icon,.svc-icon{background:rgba(37,99,235,.12)!important;color:#93c5fd!important;}

/* 4) Trial is OK, but make it compact and premium */
.trial-box,.trial-promo-left{
  border-color:rgba(34,197,94,.28)!important;
  background:linear-gradient(135deg,rgba(34,197,94,.10),rgba(15,23,42,.90))!important;
  box-shadow:none!important;
}
.trial-promo-grid span{background:rgba(2,6,23,.30)!important;border-color:rgba(148,163,184,.18)!important;}

/* 5) App layout: first impression must be compliance, not demo blocks */
.main{padding-top:84px!important;}
#introPage .intro-hero h3,
#introMainTitle{
  font-size:28px!important;
  letter-spacing:-.03em!important;
  line-height:1.15!important;
}
#introMainText{
  max-width:760px!important;
  color:#cbd5e1!important;
  line-height:1.55!important;
}
#introPage .intro-hero{
  border-radius:24px!important;
  border:1px solid var(--atsrs-border)!important;
  background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(15,23,42,.88))!important;
}

/* Make dashboard/compliance numbers visually primary */
.stats-grid .card,
#dashboardPage .card,
#compliancePage .card{
  border-radius:20px!important;
  background:rgba(15,23,42,.82)!important;
}
.stat{letter-spacing:-.04em!important;}

/* 6) Hide obvious unfinished/beta UI that reduces trust */
/* CV generator beta card */
#cvPage [class*="coming"],
#cvPage .coming-soon,
#cvPage .beta,
#cvPage button[id*="generate"],
#cvPage button:disabled,
#cvPage h4,
#cvPage h3+button{
  display:none!important;
}

/* Reports unfinished backend copy */
#reportsPage p,
#reportsPage .sub,
#reportsPage .small-note{
  color:#94a3b8!important;
}

/* Timezone/profile visibility should not look like core product */
#settingsPage select,
#profilePage select{
  max-width:360px!important;
}

/* 7) Buttons: fewer aggressive colors */
button{
  border-radius:12px!important;
  box-shadow:none!important;
}
button.secondary,
.secondary{background:#334155!important;color:#e5e7eb!important;border:1px solid rgba(148,163,184,.22)!important;}
button.secondary:hover,.secondary:hover{background:#3b4758!important;}
.testbtn{background:#166534!important;border:1px solid rgba(134,239,172,.22)!important;}
.top-logout{
  width:auto!important;
  min-width:auto!important;
  background:rgba(127,29,29,.78)!important;
  border:1px solid rgba(248,113,113,.32)!important;
  padding:10px 13px!important;
}
.top-logout:hover{background:rgba(153,27,27,.95)!important;}

/* 8) Forms and inputs: consistent SaaS look */
input,select,textarea{
  background:#020617!important;
  border:1px solid rgba(148,163,184,.25)!important;
  color:#e5e7eb!important;
  outline:none!important;
}
input:focus,select:focus,textarea:focus,button:focus-visible{
  border-color:#60a5fa!important;
  box-shadow:0 0 0 3px rgba(96,165,250,.18)!important;
}

/* 9) Tables: less cramped */
.table-wrap{border:1px solid var(--atsrs-border)!important;border-radius:16px!important;background:rgba(15,23,42,.55)!important;}
table{min-width:680px!important;}
th{color:#cbd5e1!important;background:rgba(2,6,23,.32)!important;font-size:12px!important;text-transform:uppercase!important;letter-spacing:.04em!important;}
td{color:#e5e7eb!important;}

/* 10) Mobile cleanup */
@media(max-width:800px){
  .auth{padding:16px!important;align-items:flex-start!important;}
  .auth-intro{max-width:100%!important;padding:20px!important;}
  .auth-card{max-width:100%!important;padding:22px!important;}
  .app{grid-template-columns:1fr!important;}
  .sidebar{padding:18px 110px 18px 16px!important;}
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important;}
  .nav button{font-size:13px!important;padding:10px!important;}
  .top-actions{position:absolute!important;top:16px!important;right:16px!important;}
  html[dir="rtl"] .top-actions{right:auto!important;left:16px!important;}
  .main{padding:78px 14px 16px!important;}
  .grid.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
}
@media(max-width:520px){
  .grid.stats-grid{grid-template-columns:1fr!important;}
  .nav{grid-template-columns:1fr!important;}
  .sidebar{padding-right:92px!important;}
  .lang-circle{width:40px!important;height:40px!important;min-width:40px!important;}
  .top-logout{padding:9px 11px!important;font-size:12px!important;}
  .lang-menu{width:164px!important;}
}
</style>

<script id="atsrs-v88-professional-cleanup-js">
(function(){
  'use strict';
  const BUILD={version:'ATSRS V88',date:'06 Jun 2026 04:18 UTC',label:'PROFESSIONAL UX CLEANUP BUILD'};

  function text(el,value){ if(el && value) el.textContent=value; }
  function html(el,value){ if(el && value) el.innerHTML=value; }
  function q(s,root=document){ return root.querySelector(s); }
  function qa(s,root=document){ return Array.from(root.querySelectorAll(s)); }

  function updateBuildBadge(){
    const badge=document.getElementById('buildBadge');
    if(!badge) return;
    badge.innerHTML='<div>'+BUILD.version+'</div><div>Last Update: '+BUILD.date+'</div><div>'+BUILD.label+'</div>';
  }

  function updateCoreCopy(){
    const copy={
      en:{
        title:'Professional document, expiry and profile sharing platform',
        body:'ATSRS helps offshore, marine, ROV, NDT and technical personnel track certificates, medicals, visas, references and compliance documents in one secure workspace.',
        compliance:'Compliance control, not document chaos.',
        cv:'Store your latest CV and share it with employers when needed.',
        reports:'Export local compliance data when your records are ready.'
      },
      az:{
        title:'Peşəkar sənəd, bitmə tarixi və profil paylaşım platforması',
        body:'ATSRS offshore, marine, ROV, NDT və texniki personal üçün sertifikat, medical, viza, reference və compliance sənədlərini bir təhlükəsiz iş sahəsində izləməyə kömək edir.',
        compliance:'Sənəd xaosu yox, compliance nəzarəti.',
        cv:'Son CV-ni saxla və lazım olduqda işəgötürənlərlə paylaş.',
        reports:'Məlumatlar hazır olduqda lokal compliance datasını export et.'
      },
      ru:{
        title:'Платформа для документов, сроков действия и профиля',
        body:'ATSRS помогает offshore, marine, ROV, NDT и техническим специалистам отслеживать сертификаты, medical, визы, references и compliance-документы в одном защищённом рабочем пространстве.',
        compliance:'Не хаос документов, а контроль compliance.',
        cv:'Храните актуальное CV и делитесь им с работодателями при необходимости.',
        reports:'Экспортируйте локальные compliance-данные, когда записи готовы.'
      }
    };
    const lang=(window.lang||localStorage.getItem('atsrs_lang')||document.documentElement.lang||'en').slice(0,2);
    const c=copy[lang]||copy.en;
    text(document.getElementById('introMainTitle'),c.title);
    text(document.getElementById('introMainText'),c.body);
    text(document.getElementById('authSubtitle'),c.compliance);
    const cvPage=document.getElementById('cvPage');
    if(cvPage){
      const p=cvPage.querySelector('p');
      if(p) p.textContent=c.cv;
    }
    const reportsPage=document.getElementById('reportsPage');
    if(reportsPage){
      const p=reportsPage.querySelector('p');
      if(p) p.textContent=c.reports;
    }
  }

  function hideUnfinishedBetaBlocks(){
    qa('h4,h3,button,p,span,div').forEach(el=>{
      const t=(el.textContent||'').trim().toLowerCase();
      if(!t) return;
      const noisy=(t.includes('coming soon') || t.includes('generate atsrs profile cv') || t.includes('generate atsrs cv (beta)') || t.includes('backend data'));
      if(noisy){
        const card=el.closest('.card,.panel,.ref-card,.mini-panel') || el;
        card.style.display='none';
      }
    });
  }

  function makeLanguageMenusLeftAligned(){
    qa('.lang-menu button').forEach(btn=>{
      btn.style.justifyContent='flex-start';
      btn.style.textAlign='left';
    });
  }

  function forceTopActionsPageBound(){
    const app=document.getElementById('app');
    const top=document.querySelector('.top-actions');
    if(app) app.style.position='relative';
    if(top){
      top.style.position='absolute';
      top.style.top='18px';
      top.style.right='18px';
      top.style.left='auto';
      top.style.zIndex='20';
    }
  }

  function setDefaultPagePriority(){
    // Keep existing behaviour. Only if intro is blank, direct user to dashboard-like value.
    const pageTitle=document.getElementById('pageTitle');
    if(pageTitle && !pageTitle.textContent.trim()) pageTitle.textContent='ATSRS Platform';
  }

  function applyV88(){
    updateBuildBadge();
    updateCoreCopy();
    hideUnfinishedBetaBlocks();
    makeLanguageMenusLeftAligned();
    forceTopActionsPageBound();
    setDefaultPagePriority();
  }

  const baseApplyLanguage=window.applyLanguage;
  if(typeof baseApplyLanguage==='function'){
    window.applyLanguage=function(){
      const result=baseApplyLanguage.apply(this,arguments);
      setTimeout(applyV88,0);
      return result;
    };
  }

  const baseChangeLanguage=window.changeLanguage;
  if(typeof baseChangeLanguage==='function'){
    window.changeLanguage=function(){
      const result=baseChangeLanguage.apply(this,arguments);
      setTimeout(applyV88,0);
      return result;
    };
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',applyV88);
  else applyV88();
  setTimeout(applyV88,300);
  setTimeout(applyV88,1200);
})();
</script>
