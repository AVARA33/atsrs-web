<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATSRS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb}
.hidden{display:none!important}
button,input,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #334155}
input,select{background:#0f172a;color:white}
button{background:#2563eb;color:white;font-weight:bold;cursor:pointer;border:0}
button:disabled{background:#64748b;cursor:not-allowed}
.secondary{background:#475569}.action{background:#dc2626}.linkbtn{background:transparent;color:#93c5fd;text-align:left;padding:6px}
.testbtn{background:#16a34a}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#020617,#1e3a8a);padding:20px}
.auth-card{width:100%;max-width:430px;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:28px}
.logo{font-size:40px;font-weight:900;margin:0}.sub{color:#94a3b8}.error{color:#f87171;font-size:14px;margin:4px 0}
.input-error{border:2px solid #ef4444!important;background:#2a1111!important}.input-ok{border:2px solid #22c55e!important}.error{margin-top:-2px;margin-bottom:8px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#020617;border-right:1px solid #1e293b;padding:22px}.brand{font-size:30px;font-weight:900}
.nav button{text-align:left;background:transparent;color:#cbd5e1}.nav button.active,.nav button:hover{background:#1e293b;color:white}
.main{padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card,.panel{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:16px}
.stat{font-size:38px;font-weight:900}.warning{color:#facc15}.danger{color:#f87171}.good{color:#4ade80}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #334155;text-align:left}
@media(max-width:800px){.app{grid-template-columns:1fr}}

.lang-floating{position:fixed;top:18px;right:18px;z-index:50}
.lang-circle{width:48px;height:48px;border-radius:50%;padding:0;margin:0;background:#111827;border:1px solid #334155;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lang-menu{position:absolute;top:56px;right:0;width:220px;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.lang-menu button{background:transparent;color:#e5e7eb;text-align:left;margin:2px 0;padding:10px 12px;border:0;border-radius:10px;font-weight:600}
.lang-menu button:hover{background:#1e293b}
.lang-menu span{display:inline-block;width:28px}
html[dir="rtl"] .lang-floating{right:auto;left:18px}
html[dir="rtl"] .lang-menu{right:auto;left:0}

</style>
</head>
<body>

<section id="auth" class="auth">
<div class="auth-card">
<h1 class="logo">ATSRS</h1>
<p id="authSubtitle" class="sub"></p>

<div class="lang-floating">
<button type="button" id="langCircle" class="lang-circle" onclick="toggleLangMenu()">🇬🇧</button>
<div id="langMenu" class="lang-menu hidden">
<button type="button" onclick="changeLanguage('en')"><span>🇬🇧</span> English</button>
<button type="button" onclick="changeLanguage('az')"><span>🇦🇿</span> Azərbaycan</button>
<button type="button" onclick="changeLanguage('ru')"><span>🇷🇺</span> Русский</button>
<button type="button" onclick="changeLanguage('tr')"><span>🇹🇷</span> Türkçe</button>
<button type="button" onclick="changeLanguage('no')"><span>🇳🇴</span> Norsk</button>
<button type="button" onclick="changeLanguage('de')"><span>🇩🇪</span> Deutsch</button>
<button type="button" onclick="changeLanguage('fr')"><span>🇫🇷</span> Français</button>
<button type="button" onclick="changeLanguage('es')"><span>🇪🇸</span> Español</button>
<button type="button" onclick="changeLanguage('pt')"><span>🇵🇹</span> Português</button>
<button type="button" onclick="changeLanguage('ar')"><span>🇸🇦</span> العربية</button>
</div>
</div>

<div id="loginBox">
<h2 id="loginTitle"></h2>
<input id="loginEmail" type="email">
<p id="loginEmailRule" class="error hidden"></p>
<input id="loginPassword" type="password">
<button id="loginBtn" onclick="login()"></button>
<button id="localTestBtn" class="testbtn" onclick="localTestLogin()">Local Test Login</button>
<button id="supabaseTestBtn" class="secondary" onclick="testSupabaseConnection()">Test Supabase Connection</button>
<p id="supabaseTestMsg" class="sub"></p>
<button id="createBtn" class="secondary" onclick="showRegister()"></button>
<button id="forgotBtn" class="linkbtn" onclick="showForgot()"></button>
<p id="loginMsg" class="sub"></p>
</div>

<div id="registerBox" class="hidden">
<h2 id="registerTitle"></h2>
<input id="regEmail" type="email">
<p id="regEmailRule" class="error hidden"></p>
<input id="regPassword" type="password">
<p id="passRule" class="error hidden"></p>
<input id="regPassword2" type="password">
<p id="matchRule" class="error hidden"></p>
<button id="registerBtn" onclick="register()"></button>
<button id="backLoginBtn1" class="secondary" onclick="showLogin()"></button>
<p id="regMsg" class="sub"></p>
</div>

<div id="forgotBox" class="hidden">
<h2 id="resetTitle"></h2>
<p id="resetInfo" class="sub"></p>
<input id="resetEmail" type="email">
<p id="resetEmailRule" class="error hidden"></p>
<button id="resetBtn" onclick="forgotPassword()"></button>
<button id="backLoginBtn2" class="secondary" onclick="showLogin()"></button>
<p id="resetMsg" class="sub"></p>
</div>

<div id="newPasswordBox" class="hidden">
<h2 id="newPassTitle"></h2>
<input id="newPassword" type="password">
<input id="newPassword2" type="password">
<button id="saveNewPassBtn" onclick="updatePassword()"></button>
<p id="newPassMsg" class="sub"></p>
</div>
</div>
</section>

<section id="app" class="app hidden">
<aside class="sidebar">
<div class="brand">ATSRS</div>
<p id="cabinetText" class="sub"></p>
<div class="nav">
<button id="navDashboard" class="active" onclick="showPage('dashboard',this)"></button>
<button id="navPersonnel" onclick="showPage('personnel',this)"></button>
<button id="navCertificates" onclick="showPage('certificates',this)"></button>
<button id="navProfile" onclick="showPage('profile',this)"></button>
<button id="navLogout" onclick="logout()"></button>
</div>
</aside>

<main class="main">
<h2 id="pageTitle"></h2>

<section id="dashboardPage">
<div class="grid">
<div class="card"><p id="totalPersonnelText"></p><div class="stat" id="totalPersonnel">0</div></div>
<div class="card"><p id="totalCertsText"></p><div class="stat" id="totalCerts">0</div></div>
<div class="card"><p id="exp90Text"></p><div class="stat warning" id="exp90">0</div></div>
<div class="card"><p id="expiredText"></p><div class="stat danger" id="expired">0</div></div>
</div>
</section>

<section id="personnelPage" class="hidden">
<div class="panel">
<h3 id="addPersonnelTitle"></h3>
<input id="pName">
<input id="pPosition">
<input id="pCompany">
<input id="pEmail">
<button id="addPersonnelBtn" onclick="addPersonnel()"></button>
</div>
<div class="panel">
<h3 id="personnelListTitle"></h3>
<table>
<thead><tr><th id="thName1"></th><th id="thPosition1"></th><th id="thCompany1"></th><th>Email</th><th id="thAction1"></th></tr></thead>
<tbody id="personnelTable"></tbody>
</table>
</div>
</section>

<section id="certificatesPage" class="hidden">
<div class="panel">
<h3 id="addCertTitle"></h3>
<select id="cPerson"></select>
<select id="cType">
<option>BOSIET / FOET</option><option>Offshore Medical</option><option>Seaman Book</option>
<option>Passport</option><option>Visa</option><option>Yellow Fever</option>
<option>DP Certificate</option><option>ROV Competency</option><option>Other</option>
</select>
<input id="cProvider">
<input id="cExpiry" type="date">
<button id="addCertBtn" onclick="addCertificate()"></button>
</div>
<div class="panel">
<h3 id="certRegisterTitle"></h3>
<table>
<thead><tr><th id="thName2"></th><th id="thCertificate2"></th><th id="thProvider2"></th><th id="thExpiry2"></th><th id="thStatus2"></th><th id="thAction2"></th></tr></thead>
<tbody id="certTable"></tbody>
</table>
</div>
</section>

<section id="profilePage" class="hidden">
<div class="panel">
<h3 id="profileTitle"></h3>
<p id="userEmail" class="sub"></p>
<input id="profileName">
<input id="profileCompany">
<input id="profilePosition">
<button id="saveProfileBtn" onclick="saveProfile()"></button>
</div>
</section>
</main>
</section>

function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim())}
function markEmail(input, rule){
  if(!validEmail(input.value)){
    input.classList.add("input-error");
    input.classList.remove("input-ok");
    rule.innerText=emailMsg();
    rule.classList.remove("hidden");
    return false;
  }
  input.classList.remove("input-error");
  input.classList.add("input-ok");
  rule.classList.add("hidden");
  return true;
}
function clearEmailMark(input, rule){
  input.classList.remove("input-error","input-ok");
  rule.classList.add("hidden");
}
function emailEnterHandler(e, input, rule, action){
  if(e.key==="Enter"){
    e.preventDefault();
    if(markEmail(input, rule) && action) action();
  }
}

function validateRegisterFields(){
let p1=regPassword.value.trim(),p2=regPassword2.value.trim(),ok=true;
if(p1.length>0&&p1.length<6){regPassword.classList.add("input-error");regPassword.classList.remove("input-ok");passRule.classList.remove("hidden");ok=false}
else if(p1.length>=6){regPassword.classList.remove("input-error");regPassword.classList.add("input-ok");passRule.classList.add("hidden")}
else{regPassword.classList.remove("input-error","input-ok");passRule.classList.add("hidden");ok=false}
if(p2.length>0&&p1!==p2){regPassword2.classList.add("input-error");regPassword2.classList.remove("input-ok");matchRule.classList.remove("hidden");ok=false}
else if(p2.length>0&&p1===p2&&p1.length>=6){regPassword2.classList.remove("input-error");regPassword2.classList.add("input-ok");matchRule.classList.add("hidden")}
else{regPassword2.classList.remove("input-error","input-ok");matchRule.classList.add("hidden");ok=false}
return ok;
}

function startCountdown(){countdown=60;resetBtn.disabled=true;resetBtn.innerText="Resend in 60s";if(timer)clearInterval(timer);timer=setInterval(()=>{countdown--;resetBtn.innerText="Resend in "+countdown+"s";if(countdown<=0){clearInterval(timer);resetBtn.disabled=false;resetBtn.innerText=tr("sendReset")}},1000)}


async function testSupabaseConnection(){
  supabaseTestMsg.innerText="Testing Supabase...";
  try{
    const healthUrl=SUPABASE_URL.replace(/\/$/,"")+"/auth/v1/health";
    const res=await fetch(healthUrl,{method:"GET",headers:{apikey:SUPABASE_KEY}});
    const txt=await res.text();
    supabaseTestMsg.innerText="Supabase reachable. HTTP "+res.status+" — "+txt.slice(0,120);
    console.log("Supabase health:",res.status,txt);
  }catch(e){
    supabaseTestMsg.innerText="Supabase fetch failed. Browser cannot reach Supabase project. Check project status, URL/key, network block, or Supabase domain access.";
    console.error("Supabase connection test failed:",e);
  }
}

async function register(){
let email=regEmail.value.trim(),password=regPassword.value.trim(),password2=regPassword2.value.trim();regMsg.innerText="";
regEmail.classList.remove("input-error");
if(!email||!password||!password2){regMsg.innerText=tr("fill");if(!email){regEmail.classList.add("input-error");regEmailRule.innerText=emailMsg();regEmailRule.classList.remove("hidden")}return}
if(!markEmail(regEmail,regEmailRule)){regMsg.innerText=emailMsg();return}
if(!validateRegisterFields()){regMsg.innerText=tr("fix");return}
if(!supabaseClient){regMsg.innerText="Supabase library did not load.";return}
regMsg.innerText="Creating account...";
try{
const {error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:APP_URL}});
regMsg.innerText=error?error.message:"Confirmation email sent. Check inbox/spam, then login.";
}catch(e){regMsg.innerText=networkMsg();console.error("Register failed:",e)}
}

async function login(){
let email=loginEmail.value.trim(),password=loginPassword.value.trim();loginMsg.innerText="";clearLoginErrors();
if(!email||!password){loginMsg.innerText=tr("enterLogin");if(!email){loginEmail.classList.add("input-error");loginEmailRule.innerText=emailMsg();loginEmailRule.classList.remove("hidden")}if(!password)loginPassword.classList.add("input-error");return}
if(!markEmail(loginEmail,loginEmailRule)){loginMsg.innerText=emailMsg();return}
if(!supabaseClient){loginMsg.innerText="Supabase library did not load.";return}
loginMsg.innerText="Logging in...";
try{
const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
if(error){loginMsg.innerText=error.message;return}
currentUser=data.user;openApp();
}catch(e){loginMsg.innerText=networkMsg();console.error("Login failed:",e)}
}

async function forgotPassword(){
let email=resetEmail.value.trim();resetMsg.innerText="";
resetEmail.classList.remove("input-error");
if(!email){resetMsg.innerText=tr("enterLogin");resetEmail.classList.add("input-error");resetEmailRule.innerText=emailMsg();resetEmailRule.classList.remove("hidden");return}
if(!markEmail(resetEmail,resetEmailRule)){resetMsg.innerText=emailMsg();return}
if(!supabaseClient){resetMsg.innerText="Supabase library did not load.";return}
startCountdown();resetMsg.innerText=tr("sending");
try{
const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});
resetMsg.innerText=error?error.message:tr("sent");
}catch(e){resetMsg.innerText=networkMsg();console.error("Reset password failed:",e)}
}

async function updatePassword(){
let p1=newPassword.value.trim(),p2=newPassword2.value.trim();
if(!p1||!p2){newPassMsg.innerText=tr("fill");return}
if(p1.length<6){newPassword.classList.add("input-error");newPassMsg.innerText=tr("passRule");return}
if(p1!==p2){newPassword2.classList.add("input-error");newPassMsg.innerText=tr("matchRule");return}
try{
const {error}=await supabaseClient.auth.updateUser({password:p1});
newPassMsg.innerText=error?error.message:"Password updated.";
}catch(e){newPassMsg.innerText=tr("connection");console.error(e)}
}

}

}

function status(expiry){
let t=new Date();t.setHours(0,0,0,0);let e=new Date(expiry);
let d=Math.ceil((e-t)/(1000*60*60*24));
if(d<0)return{txt:tr("expired"),cls:"danger",risk:true,expired:true};
if(d<=30)return{txt:tr("exp30s"),cls:"danger",risk:true};
if(d<=90)return{txt:tr("exp90s"),cls:"warning",risk:true};
return{txt:tr("valid"),cls:"good",risk:false};
}

function renderAll(){
if(!currentUser)return;
let p=getData("personnel"),c=getData("certs");
totalPersonnel.innerText=p.length;totalCerts.innerText=c.length;
personnelTable.innerHTML="";
cPerson.innerHTML=`<option value="">${tr("selectCrew")}</option>`;
p.forEach((x,i)=>{
personnelTable.innerHTML+=`<tr><td>${x.name}</td><td>${x.position}</td><td>${x.company}</td><td>${x.email}</td><td><button class="action" onclick="deletePersonnel(${i})">${tr("delete")}</button></td></tr>`;
cPerson.innerHTML+=`<option>${x.name}</option>`;
});
certTable.innerHTML="";let e90=0,ex=0;
c.forEach((x,i)=>{
let s=status(x.expiry);if(s.risk&&!s.expired)e90++;if(s.expired)ex++;
certTable.innerHTML+=`<tr><td>${x.person}</td><td>${x.type}</td><td>${x.provider}</td><td>${x.expiry}</td><td class="${s.cls}">${s.txt}</td><td><button class="action" onclick="deleteCert(${i})">${tr("delete")}</button></td></tr>`;
});
exp90.innerText=e90;expired.innerText=ex;
}

let p=JSON.parse(localStorage.getItem(localKey("profile")))||{};
profileName.value=p.name||"";profileCompany.value=p.company||"";profilePosition.value=p.position||"";
}

supabaseClient.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){hideAuthBoxes();newPasswordBox.classList.remove("hidden")}});
